<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Retour vers Tirelire</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7f2;
           color: #2b2540; font: 17px/1.5 -apple-system, system-ui, sans-serif; text-align: center; }
    a { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 999px;
        background: #5d5bd6; color: #fff; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #121114; color: #f4f1fa; } }
  </style>
</head>
<body>
  <main>
    <p>Retour vers Tirelire…</p>
    <a id="back" href="tirelire://bank-link">Revenir dans Tirelire</a>
  </main>
  <script>
    // Banks only redirect to https addresses. This page hands what the bank sent back
    // (authorization code, state, or error) to the app, unchanged. Nothing is stored or sent elsewhere.
    var target = "tirelire://bank-link" + window.location.search;
    document.getElementById("back").href = target;
    window.location.replace(target);
  </script>
</body>
</html>
